<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acefall - Login</title>
  <link rel="stylesheet" href="loginstyle.css">
  <link rel="stylesheet" href="mobile.css">
  <script src="main.js" defer></script>
</head>
<body>

  <ul class="navbar" id="navbar">
    <li><img src="images/logo.png" alt="logo" class="logo"></li>
    <li><a href="index.html">Home</a></li>
    <li><a href="store.html">Store</a></li>
    <li><a href="collection.html">Collection</a></li>
    <li class="popbtn" onclick="openpopup()">Settings</li>
  </ul>

  <main>
    <h1>Log in</h1>
    <form>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Log in</button>
    </form>
  </main>

  <footer>
    <ul class="footer">
      <li><a href="login.html">Login</a></li>
      <li class="popbtn" onclick="openpopup2()">Help</li>
    </ul>
    <div class="popup" id="settingspopup">
      <h2>Settings</h2>
      <div style="margin: 20px 0;">
        <p>This is the settings section. You can customize your experience here.</p>
      </div>
      <audio id="thememusic" controls="">
        <source src="acefall_theme_song.mp3" type="audio/mpeg">
      </audio>
      <button type="button" class="popbtn" onclick="closepopup()">Done</button>
    </div>
    <div class="popup2" id="helppopup">
      <h2>Help</h2>
      <div style="margin: 20px 0;">
        <p>This is the help section. helpful information on website and game is here.</p>
      </div>
      <button type="button" class="popbtn" onclick="closepopup2()">Done</button>
    </div>
  </footer>
</body>
</html>
